name: Apply compact email thread UI patch

on:
  push:
    branches:
      - fix/compact-email-thread-ui

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message != 'fix: compact relationship history email cards' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-email-thread-ui

      - name: Patch relationship history UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('pages/internal/sales/organizations/[id].tsx')
          text = path.read_text()

          pattern = re.compile(
              r'      <section className="mt-6 rounded-lg border border-gray-200 bg-white p-5 shadow-sm"><div className="flex flex-wrap items-center justify-between gap-3"><div><h2 className="font-semibold">Relationship history</h2>.*?</section>\n\n      <details className="mt-6 rounded-lg border border-gray-200 bg-white p-5 shadow-sm"><summary className="cursor-pointer list-none font-semibold">Sales workflow</summary>',
              re.DOTALL,
          )

          replacement = '''      <section className="mt-6 rounded-lg border border-gray-200 bg-white p-5 shadow-sm"><div className="flex flex-wrap items-center justify-between gap-3"><div><h2 className="font-semibold">Relationship history</h2><p className="mt-1 text-xs text-gray-500">{selectedContactId || selectedConversationId ? "Conversation view · oldest message first." : "Organization activity grouped by conversation."}</p></div><div className="text-xs text-gray-500">{conversations.reduce((count, conversation) => count + conversation.interactions.length, 0)} messages · {conversations.length} conversations</div></div><div className="mt-5 space-y-6">{conversations.length ? conversations.map((conversation) => <section key={conversation.id} className="rounded-lg border border-gray-100 bg-gray-50/50 p-4"><div className="flex flex-wrap items-start justify-between gap-2 border-b border-gray-100 pb-3"><div><div className="text-sm font-semibold text-gray-900">{conversation.contactName || "Conversation"}</div><div className="mt-1 text-xs text-gray-500">{conversation.subject || "No subject"} · {conversation.interactions.length} messages</div></div>{selectedConversationId === conversation.id ? <Link href={`/internal/sales/organizations/${organization.id}`} className="text-xs font-medium text-forest-700 hover:underline">All conversations</Link> : <Link href={`/internal/sales/organizations/${organization.id}?threadId=${encodeURIComponent(conversation.id)}`} className="text-xs font-medium text-forest-700 hover:underline">Open conversation</Link>}</div><div className="mt-4 space-y-4">{conversation.interactions.map((interaction) => { const presentation = relationshipHistoryPresentation(interaction.direction, interaction.contactName); const contactEmail = interaction.contactId ? contacts.find((contact) => contact.id === interaction.contactId)?.email : undefined; const isEmail = interaction.channel === "EMAIL"; const addressLabel = interaction.direction === "INBOUND" ? "From" : "To"; return <article key={interaction.id} className={`flex flex-col ${presentation.alignment === "right" ? "items-end" : "items-start"}`}><div className={`w-full max-w-3xl rounded-lg border px-4 py-3 ${presentation.alignment === "right" ? "border-blue-100 bg-blue-50" : "border-gray-200 bg-gray-50"}`}><div className="text-xs text-gray-500">{new Date(interaction.occurredAt).toLocaleString()}</div>{isEmail ? <div className="mt-0.5 text-xs text-gray-500">{addressLabel}: {contactEmail || interaction.contactName || "Email address not recorded"}</div> : <div className="mt-0.5 text-xs text-gray-500">{presentation.direction} · {interaction.channel}</div>}<div className="mt-2 text-sm font-medium text-gray-900">{interaction.subject || "Interaction"}</div><p className="mt-1 whitespace-pre-wrap text-sm leading-6 text-gray-700">{interaction.summary}</p>{interaction.outcomeCode ? <div className="mt-2 text-xs text-gray-400">{interaction.outcomeCode}</div> : null}</div></article>; })}</div></section>) : <p className="text-sm text-gray-500">No conversations yet.</p>}</div></section>

      <details className="mt-6 rounded-lg border border-gray-200 bg-white p-5 shadow-sm"><summary className="cursor-pointer list-none font-semibold">Sales workflow</summary>'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected to replace one relationship history section, replaced {count}')
          path.write_text(updated)
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/compact-email-thread-ui.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/internal/sales/organizations/'[id].tsx' .github/workflows/compact-email-thread-ui.yml
          git commit -m "fix: compact relationship history email cards"
          git push origin HEAD:fix/compact-email-thread-ui
