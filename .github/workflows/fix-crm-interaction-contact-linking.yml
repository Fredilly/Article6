name: Fix CRM interaction contact linking

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Create branch
        run: git checkout -b fix/crm-interaction-contact-linking
      - name: Patch CRM automation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pages/api/internal/crm-automation.ts')
          s = p.read_text()
          old = '''    externalReference?: string;\n    gmailThreadId?: string;\n  };'''
          new = '''    externalReference?: string;\n    gmailThreadId?: string;\n    contactId?: string;\n    contactEmail?: string;\n    contactName?: string;\n  };'''
          if old not in s:
              raise SystemExit('interface anchor not found')
          s = s.replace(old, new, 1)

          old = '''  const externalReference = command.interaction.externalReference?.trim();\n  const duplicateInteraction = Boolean('''
          new = '''  const externalReference = command.interaction.externalReference?.trim();\n\n  const requestedContactId = command.interaction.contactId?.trim();\n  const requestedContactEmail = command.interaction.contactEmail?.trim().toLowerCase();\n  const requestedContactName = command.interaction.contactName?.trim().toLowerCase();\n  const summaryLower = command.interaction.summary.trim().toLowerCase();\n\n  let resolvedContactId: string | undefined;\n  if (requestedContactId) {\n    const match = before.contacts.find((contact) => contact.id === requestedContactId);\n    if (!match) throw new Error("Interaction contact does not belong to the selected organization.");\n    resolvedContactId = match.id;\n  } else if (requestedContactEmail) {\n    const matches = before.contacts.filter((contact) => contact.email?.trim().toLowerCase() === requestedContactEmail);\n    if (matches.length > 1) throw new Error("Interaction contact email is ambiguous within the selected organization.");\n    resolvedContactId = matches[0]?.id;\n  } else if (requestedContactName) {\n    const matches = before.contacts.filter((contact) => contact.name.trim().toLowerCase() === requestedContactName);\n    if (matches.length > 1) throw new Error("Interaction contact name is ambiguous within the selected organization.");\n    resolvedContactId = matches[0]?.id;\n  } else {\n    const summaryMatches = before.contacts.filter((contact) => {\n      const name = contact.name.trim().toLowerCase();\n      const email = contact.email?.trim().toLowerCase();\n      return (name && summaryLower.includes(name)) || Boolean(email && summaryLower.includes(email));\n    });\n    if (summaryMatches.length === 1) resolvedContactId = summaryMatches[0].id;\n    else if (before.contacts.length === 1) resolvedContactId = before.contacts[0].id;\n  }\n\n  const duplicateInteraction = Boolean('''
          if old not in s:
              raise SystemExit('resolution anchor not found')
          s = s.replace(old, new, 1)

          old = '''      organizationId: organization.id,\n      channel: command.interaction.channel || "EMAIL",'''
          new = '''      organizationId: organization.id,\n      contactId: resolvedContactId,\n      channel: command.interaction.channel || "EMAIL",'''
          if old not in s:
              raise SystemExit('add interaction anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Add regression test
        run: |
          cat > tests/crm-automation-contact-linking.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import test from "node:test";

          test("CRM automation links recorded interactions to contacts", () => {
            const source = fs.readFileSync(new URL("../pages/api/internal/crm-automation.ts", import.meta.url), "utf8");
            assert.match(source, /contactId\?: string/);
            assert.match(source, /contactEmail\?: string/);
            assert.match(source, /contactName\?: string/);
            assert.match(source, /summaryMatches/);
            assert.match(source, /contactId: resolvedContactId/);
          });
          EOF
      - name: Test
        run: npm test -- --runInBand || npm test
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/api/internal/crm-automation.ts tests/crm-automation-contact-linking.test.ts
          git commit -m "fix: preserve contact identity on CRM interaction writes"
          git push origin fix/crm-interaction-contact-linking
