name: CRM verified write receipt
on:
  push:
    branches:
      - fix/crm-verified-write-receipt
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/crm-verified-write-receipt
      - name: Patch CRM automation receipt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pages/api/internal/crm-automation.ts')
          s = p.read_text()
          old = '''  const interactionVerified = externalReference\n    ? verified.interactions.some((interaction) => interaction.externalReference === externalReference)\n    : verified.interactions.some((interaction) => interaction.summary === command.interaction.summary.trim() && interaction.occurredAt === occurredAt.toISOString());\n  if (!interactionVerified) throw new Error("CRM interaction verification failed after update.");\n\n  return {\n    organizationId: organization.id,\n    organizationName: organization.name,\n    status: verified.organization.status,\n    interactionRecorded: true,\n    interactionWasDuplicate: duplicateInteraction,\n  };'''
          new = '''  const verifiedInteraction = externalReference\n    ? verified.interactions.find((interaction) => interaction.externalReference === externalReference)\n    : verified.interactions.find((interaction) => interaction.summary === command.interaction.summary.trim() && interaction.occurredAt === occurredAt.toISOString());\n  if (!verifiedInteraction) throw new Error("CRM interaction verification failed after update.");\n\n  const verifiedContact = verifiedInteraction.contactId\n    ? verified.contacts.find((contact) => contact.id === verifiedInteraction.contactId)\n    : undefined;\n  if (channel === "EMAIL" && (!verifiedInteraction.contactId || !verifiedContact?.email)) {\n    throw new Error("CRM email interaction verification failed: stored interaction is not linked to a contact with an email address.");\n  }\n\n  return {\n    organizationId: organization.id,\n    organizationName: organization.name,\n    status: verified.organization.status,\n    interactionId: verifiedInteraction.id,\n    interactionRecorded: true,\n    interactionWasDuplicate: duplicateInteraction,\n    contactId: verifiedInteraction.contactId || null,\n    contactName: verifiedContact?.name || null,\n    contactEmail: verifiedContact?.email || null,\n    gmailThreadId: verifiedInteraction.gmailThreadId || null,\n    verifiedFromDatabase: true,\n  };'''
          if old not in s:
              raise SystemExit('verification anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Add regression test
        run: |
          cat > tests/crm-verified-write-receipt.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import test from "node:test";

          test("CRM interaction write returns a database-verified receipt", () => {
            const source = fs.readFileSync(new URL("../pages/api/internal/crm-automation.ts", import.meta.url), "utf8");
            assert.match(source, /const verifiedInteraction = externalReference/);
            assert.match(source, /const verifiedContact = verifiedInteraction\.contactId/);
            assert.match(source, /CRM email interaction verification failed/);
            assert.match(source, /interactionId: verifiedInteraction\.id/);
            assert.match(source, /contactEmail: verifiedContact\?\.email \|\| null/);
            assert.match(source, /verifiedFromDatabase: true/);
          });
          EOF
      - name: Test focused CRM guards
        run: node --experimental-strip-types --test tests/crm-automation-contact-linking.test.ts tests/crm-email-contact-required.test.ts tests/crm-verified-write-receipt.test.ts
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-crm-verified-write-receipt.yml
          git add pages/api/internal/crm-automation.ts tests/crm-verified-write-receipt.test.ts
          git commit -m "fix: return database-verified CRM interaction receipts"
          git push origin fix/crm-verified-write-receipt
